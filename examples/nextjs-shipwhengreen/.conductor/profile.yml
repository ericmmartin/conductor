# Example: a Next.js project that auto-merges when CI + Qodo are green.
# Drop this into .conductor/profile.yml in your repo and adjust the specifics.
name: my-nextjs-app

stack:
  primary: nextjs
  db: postgres

project:
  number: 1
  status_field: Status
  ready_status: Ready
  ready_at_field: Ready At

branches:
  default: main
  pr_target: main

workflow:
  mode: ship_when_green

review:
  default: required
  skip_label: skip-code-review

author: user

gates:
  - name: lint
    command: npm run lint
  - name: typecheck
    command: npm run typecheck
  - name: test
    command: npm test
  - name: build
    command: npm run build

reviewers:
  bots:
    - qodo-code-review

models:
  default:
    model: sonnet
    effort: medium
  skills:
    triage:  { model: haiku, effort: low }
    audit:   { model: haiku, effort: low }
    ship:    { model: haiku, effort: low }
    work:    { model: opus,  effort: high }

notifications:
  discord:
    webhook_env: DISCORD_WEBHOOK

version:
  source: package.json
  changelog: keepachangelog
